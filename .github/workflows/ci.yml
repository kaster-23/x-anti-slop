name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Build Chrome (MV3)
        run: pnpm build

      - name: Build Firefox (MV2)
        run: pnpm build:firefox

      - name: Check unpacked builds
        run: |
          test -f .output/chrome-mv3/manifest.json
          test -f .output/firefox-mv2/manifest.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const chrome = JSON.parse(readFileSync('.output/chrome-mv3/manifest.json', 'utf8'));
            const firefox = JSON.parse(readFileSync('.output/firefox-mv2/manifest.json', 'utf8'));
            if (chrome.manifest_version !== 3) throw new Error('Chrome build is not MV3');
            if (firefox.manifest_version !== 2) throw new Error('Firefox build is not MV2');
            if (chrome.name !== 'x-anti-slop' || firefox.name !== 'x-anti-slop') {
              throw new Error('manifest name was not rebranded');
            }
            const background = JSON.stringify(chrome.background ?? {});
            if (!background.includes('service_worker')) throw new Error('Chrome build has no background service worker');
            const firefoxBg = JSON.stringify(firefox.background ?? {});
            if (!firefoxBg.includes('background.js')) throw new Error('Firefox build has no background script');
            const perms = firefox.browser_specific_settings?.gecko?.data_collection_permissions?.required ?? [];
            if (!perms.includes('websiteContent')) throw new Error('Firefox build does not declare website content transmission');
          "
          if grep -q 'api.typesafe.ai' .output/chrome-mv3/content-scripts/content.js; then
            echo 'Chrome content script contains the provider host' >&2
            exit 1
          fi
          if ! grep -q 'api.typesafe.ai' .output/chrome-mv3/background.js; then
            echo 'Chrome background worker is missing the provider host' >&2
            exit 1
          fi
